
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authserver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Disabled because long-lived SSE requests (/api/contest/stream,
    # /api/team/stream) would otherwise hold a Hikari connection for the
    # entire 30-minute stream lifetime, exhausting the pool and timing out
    # /auth/refresh and the cold-load REST probe. DTO mapping already
    # happens inside @Transactional service methods, so disabling OSIV
    # is safe here.
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:namelessorgao@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:caku ucxf cvuq cicb}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

