<style>
        body {
            background-color: #0F172A; /* Requested deep midnight slate */
        }
        
        /* Custom styles for input focus glow */
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5); /* #3B82F6 subtle glow */
            border-color: #3B82F6;
        }

        /* Minimal ambient glow for the card */
        .ambient-glow {
            box-shadow: 0 0 40px -10px rgba(59, 130, 246, 0.15), 0 0 20px -5px rgba(223, 116, 18, 0.05); /* Blue and subtle gold/tertiary glow */
        }

<body class="min-h-screen flex items-center justify-center font-body-md text-body-md text-on-surface antialiased bg-[#0F172A]">
<main class="w-full max-w-md px-6 py-xxl">
<!-- Brand Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-surface-container border border-outline-variant mb-md shadow-[0_0_15px_rgba(59,130,246,0.2)]">
<span class="material-symbols-outlined text-[32px] text-[#3B82F6]" style="font-variation-settings: 'FILL' 1;">
                    terminal
                </span>
</div>
<h1 class="font-h2 text-h2 text-on-surface mb-xs tracking-tight">AuraC²</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Aura Contest Control</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container border border-outline-variant rounded-xl p-lg ambient-glow relative overflow-hidden">
<!-- Subtle top accent line -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#3B82F6] to-transparent opacity-50"></div>
<form class="space-y-lg">
<!-- Username Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-sm uppercase tracking-wider" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">
                                person
                            </span>
</div>
<input class="w-full bg-[#0F172A] border border-outline-variant rounded text-on-surface font-body-md text-body-md pl-xl py-sm input-glow transition-all duration-200 focus:outline-none placeholder-outline" id="username" name="username" placeholder="Enter your university ID" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-sm">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-[#3B82F6] hover:text-primary-container transition-colors" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">
                                lock
                            </span>
</div>
<input class="w-full bg-[#0F172A] border border-outline-variant rounded text-on-surface font-body-md text-body-md pl-xl py-sm input-glow transition-all duration-200 focus:outline-none placeholder-outline" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-[#3B82F6] hover:bg-primary-container text-white font-label-md text-label-md rounded py-sm mt-md transition-colors duration-200 flex justify-center items-center group relative overflow-hidden" type="submit">
<span class="relative z-10 flex items-center gap-sm">
                        Sign In
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">
                            arrow_forward
                        </span>
</span>
<!-- Subtle button highlight -->
<div class="absolute inset-0 bg-gradient-to-t from-black/10 to-transparent"></div>
</button>
</form>
<!-- Footer links -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Need an account? <a class="text-[#3B82F6] hover:text-primary-container font-medium transition-colors" href="#">Contact Admin</a>
</p>
</div>
</div>
<!-- System Status Indicator (Academic Context) -->
<div class="mt-xl flex justify-center items-center gap-xs text-on-surface-variant font-label-sm text-label-sm">
<div class="w-2 h-2 rounded-full bg-[#10B981]"></div>
            System Operational
        </div>
</main>
</body></html>
