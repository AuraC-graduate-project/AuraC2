<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center p-lg font-body-base text-on-surface">
<!-- Transactional Page: Navigation Shell is Intentionally Suppressed -->
<main class="w-full max-w-[420px]">
<!-- Login Card Container - Level 1 Elevation -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm overflow-hidden">
<!-- Header Section -->
<div class="px-xl py-xl flex flex-col items-center justify-center border-b border-surface-container-low bg-surface">
<!-- Academic/Authoritative Brand Anchor -->
<div class="h-16 w-16 bg-primary-container rounded-lg flex items-center justify-center mb-md border border-primary-fixed-dim/20">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">terminal</span>
</div>
<h1 class="font-h1 text-h1 text-on-background">AuraC²</h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-xs">Aura Contest Control</p>
</div>
<div class="p-xl flex flex-col gap-lg">
<!-- State Demonstrations -->
<!-- Error State: Invalid Credentials -->
<div class="bg-error-container border border-error/20 rounded-lg p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-on-error-container mt-[2px]" style="font-variation-settings: 'FILL' 1; font-size: 20px;">error</span>
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-error-container font-semibold">Authentication Failed</span>
<span class="font-body-sm text-body-sm text-on-error-container opacity-90 mt-xs">Invalid credentials provided. Please verify your username and password.</span>
</div>
</div>
<!-- Info State: Session Expired (Commented out visually to maintain focus, but structured here to show capability) -->
<!--
                <div class="bg-surface-container-high border border-outline-variant rounded-lg p-md flex items-start gap-sm">
                    <span class="material-symbols-outlined text-on-surface-variant mt-[2px]" style="font-variation-settings: 'FILL' 1; font-size: 20px;">history_toggle_off</span>
                    <span class="font-body-sm text-body-sm text-on-surface-variant">Your session has expired due to inactivity. Please sign in again.</span>
                </div>
                -->
<!-- Authentication Form -->
<form action="#" class="flex flex-col gap-lg" method="POST">
<!-- Username Field -->
<div class="flex flex-col gap-sm">
<label class="font-body-sm text-body-sm font-medium text-on-surface" for="username">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" style="font-size: 20px;">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-[10px] pl-[44px] pr-md font-body-base text-body-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="username" name="username" placeholder="Enter system ID" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-sm">
<label class="font-body-sm text-body-sm font-medium text-on-surface" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-secondary transition-colors" style="font-size: 20px;">key</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-[10px] pl-[44px] pr-md font-body-base text-body-base text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all" id="password" name="password" placeholder="Enter secure token" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full bg-secondary text-on-secondary rounded-lg py-md flex items-center justify-center gap-sm hover:bg-secondary/90 transition-colors border border-transparent" type="submit">
<span class="font-body-base text-body-base font-semibold">Sign In</span>
<span class="material-symbols-outlined" style="font-size: 20px;">login</span>
</button>
</div>
</form>
<!-- Footer Metadata / Legal (Academic context) -->
<div class="mt-md text-center">
<p class="font-label-caps text-label-caps text-outline uppercase">Authorized Access Only</p>
</div>
</div>
</div>
</main>
</body></html>
