<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md antialiased selection:bg-secondary-fixed selection:text-on-secondary-fixed">
<main class="w-full max-w-[440px] flex flex-col gap-lg relative z-10">
<div class="flex flex-col items-center gap-sm text-center mb-sm">
<div class="w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center shadow-sm mb-sm relative overflow-hidden">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">
                    terminal
                </span>
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/20 pointer-events-none"></div>
</div>
<h1 class="font-h2 text-h2 text-on-surface">AuraC²</h1>
<h2 class="font-body-base text-body-base text-on-surface-variant">Aura Contest Control</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80 border-t border-outline-variant/30 pt-sm mt-xs w-2/3 mx-auto">University Programming Contest Platform</p>
</div>
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] flex flex-col gap-lg">
<div class="bg-error-container border border-error/20 p-md rounded flex items-start gap-sm">
<span class="material-symbols-outlined text-error text-[20px] shrink-0 mt-[2px]" style="font-variation-settings: 'FILL' 1;">
                    error
                </span>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-error-container font-bold mb-base">Authentication Failed</span>
<span class="font-body-sm text-body-sm text-on-error-container">Invalid Credentials or Session Expired. Please check your username and password.</span>
</div>
</div>
<form class="flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[20px]">
                            person
                        </span>
<input class="w-full pl-[40px] pr-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded font-body-base text-body-base text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-shadow" id="username" name="username" placeholder="Contestant ID" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[20px]">
                            key
                        </span>
<input class="w-full pl-[40px] pr-md py-[10px] bg-surface-container-lowest border border-outline-variant rounded font-body-base text-body-base text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="mt-sm w-full bg-secondary hover:bg-secondary/90 active:scale-[0.98] text-on-secondary font-label-caps text-label-caps uppercase tracking-widest py-md rounded transition-all flex items-center justify-center gap-sm shadow-sm group" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">
                        arrow_forward
                    </span>
</button>
</form>
<div class="pt-lg border-t border-surface-container mt-sm text-center">
<div class="inline-flex items-center gap-sm bg-surface-container-high px-md py-sm rounded">
<span class="material-symbols-outlined text-outline text-[16px]">
                        info
                    </span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Use the credentials provided by the contest administrator.</p>
</div>
</div>
</div>
</main>
<div class="fixed bottom-0 left-0 w-full p-md text-center pointer-events-none">
<p class="font-label-caps text-label-caps text-outline opacity-60">AuraC² v2.4.1 • Secure Gateway</p>
</div>
</body></html>
