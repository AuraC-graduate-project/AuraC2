<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - AuraC²</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary-fixed-variant": "#2d486d",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#b4c5ff",
                        "tertiary-container": "#cea700",
                        "on-tertiary-fixed": "#231b00",
                        "inverse-primary": "#adc8f5",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-fixed-variant": "#574500",
                        "on-secondary-container": "#fefcff",
                        "on-primary": "#ffffff",
                        "background": "#f8f9ff",
                        "on-surface-variant": "#43474e",
                        "surface-container": "#e5eeff",
                        "surface-container-high": "#dce9ff",
                        "on-error": "#ffffff",
                        "surface-dim": "#cbdbf5",
                        "surface-tint": "#455f87",

                        "secondary-fixed": "#dbe1ff",

                        "on-secondary-fixed-variant": "#003ea8",
                        "tertiary": "#735c00",
                        "on-background": "#0b1c30",
                        "on-tertiary-container": "#4e3e00",

                        "outline": "#74777f",
                        "on-secondary": "#ffffff",
                        "surface": "#f8f9ff",

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",

                    "spacing": {
                        "container-max": "1440px",
                        "base": "4px",
                        "gutter": "20px",
                        "xl": "32px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "h3": ["manrope"],
                        "h2": ["manrope"],

<style>
        body { background-color: #F8FAFC; }
    </style>

<body class="min-h-screen flex items-center justify-center p-lg font-body-base text-body-base text-on-background">
<div class="w-full max-w-[440px]">
<div class="text-center mb-xl">
<h1 class="font-h1 text-h1 text-primary-container mb-sm tracking-tighter font-extrabold">AuraC²</h1>
<p class="font-body-base text-body-base text-on-surface-variant max-w-[300px] mx-auto">
                Aura Contest Control<br/>
<span class="font-body-sm text-body-sm text-outline">University Programming Contest Platform</span>
</p>
</div>
<div class="bg-on-primary rounded-xl border border-outline-variant shadow-[0_1px_3px_rgba(0,0,0,0.05)] overflow-hidden">
<div class="p-lg">
<form action="#" class="space-y-md" method="POST">
<div>
<label class="block font-body-sm text-body-sm font-medium text-on-surface mb-xs" for="username">Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm font-body-sm text-body-sm border border-outline-variant rounded-DEFAULT text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors outline-none" id="username" name="username" placeholder="Enter team username" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-body-sm text-body-sm font-medium text-on-surface mb-xs" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
<input class="block w-full pl-xl pr-sm py-sm font-body-sm text-body-sm border border-outline-variant rounded-DEFAULT text-on-surface placeholder:text-outline focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors outline-none" id="password" name="password" placeholder="Enter password" required="" type="password"/>
</div>
</div>
<div class="pt-sm">
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded-DEFAULT shadow-sm font-body-sm text-body-sm font-medium text-on-primary bg-secondary hover:bg-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-colors" type="submit">
                            Sign In
                        </button>
</div>
</form>
</div>
<div class="bg-surface-container-low px-lg py-md border-t border-surface-container-high">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant mt-[2px]">info</span>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-tight">
                        Use the credentials provided by the contest administrator.
                    </p>
</div>
</div>
</div>
</div>
</body></html>
