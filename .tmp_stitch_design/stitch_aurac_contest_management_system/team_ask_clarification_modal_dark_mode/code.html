<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "surface": "#10131a",
                      "on-tertiary-fixed-variant": "#723600",
                      "secondary-container": "#3f465c",

                      "on-secondary": "#283044",
                      "secondary-fixed-dim": "#bec6e0",
                      "on-secondary-fixed-variant": "#3f465c",
                      "primary-fixed": "#d8e2ff",
                      "on-secondary-fixed": "#131b2e",
                      "surface-bright": "#363941",
                      "error": "#ffb4ab",
                      "on-primary-container": "#00285d",
                      "on-error-container": "#ffdad6",
                      "surface-tint": "#adc6ff",
                      "surface-container-high": "#272a31",
                      "primary-fixed-dim": "#adc6ff",
                      "on-tertiary-fixed": "#311400",
                      "secondary": "#bec6e0",
                      "outline-variant": "#424754",
                      "secondary-fixed": "#dae2fd",
                      "surface-container-low": "#191b23",
                      "on-secondary-container": "#adb4ce",
                      "on-primary-fixed-variant": "#004395",
                      "on-primary-fixed": "#001a42",
                      "on-tertiary": "#502400",
                      "surface-variant": "#32353c",
                      "primary-container": "#4d8eff",
                      "tertiary-container": "#df7412",
                      "on-error": "#690005",
                      "outline": "#8c909f",
                      "surface-container-lowest": "#0b0e15",
                      "on-surface": "#e1e2ec",
                      "on-background": "#e1e2ec",
                      "surface-dim": "#10131a",
                      "inverse-surface": "#e1e2ec",
                      "surface-container-highest": "#32353c",
                      "background": "#10131a",
                      "on-surface-variant": "#c2c6d6",
                      "inverse-primary": "#005ac2",
                      "error-container": "#93000a"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "md": "1rem",
                      "xxl": "3rem",
                      "xs": "0.25rem",
                      "sm": "0.5rem",
                      "xl": "2rem",
                      "lg": "1.5rem"
              },
              "fontFamily": {
                      "h1": ["Manrope"],
                      "body-lg": ["Manrope"],
                      "label-sm": ["Manrope"],
                      "body-sm": ["Manrope"],
                      "h3": ["Manrope"],
                      "label-md": ["Manrope"],
                      "h2": ["Manrope"],
                      "body-md": ["Manrope"],
                      "display": ["Manrope"]
              },
              "fontSize": {
                      "h1": ["2.25rem", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-lg": ["1.125rem", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "label-sm": ["0.75rem", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700"}],
                      "body-sm": ["0.875rem", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "h3": ["1.5rem", {"lineHeight": "1.4", "fontWeight": "600"}],
                      "label-md": ["0.875rem", {"lineHeight": "1", "letterSpacing": "0.02em", "fontWeight": "600"}],
                      "h2": ["1.875rem", {"lineHeight": "1.3", "fontWeight": "600"}],
                      "body-md": ["1rem", {"lineHeight": "1.5", "fontWeight": "400"}],
                      "display": ["3.75rem", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-background h-screen flex overflow-hidden antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Mock Background App Shell for Context -->
<aside class="hidden md:flex flex-col bg-[#0F172A] border-r border-[#334155] w-64 h-full py-4 space-y-2 z-10 shrink-0">
<div class="px-6 pb-6 pt-2">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary/20 flex items-center justify-center shrink-0 border border-primary/30">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<div>
<h2 class="font-label-sm text-[#94A3B8] uppercase tracking-widest">ACM-ICPC Portal</h2>
<p class="font-body-sm text-[#F1F5F9] font-medium">Admin Console</p>
</div>
</div>
</div>
<nav class="flex-1 px-3 space-y-1">
<a class="flex items-center gap-3 px-3 py-2 rounded-sm text-[#94A3B8] hover:bg-[#1E293B] hover:text-[#F1F5F9] transition-colors font-manrope text-sm font-medium scale-95 active:scale-100" href="#">
<span class="material-symbols-outlined text-lg">dashboard</span>
                Overview
            </a>
<a class="flex items-center gap-3 px-3 py-2 rounded-sm text-[#94A3B8] hover:bg-[#1E293B] hover:text-[#F1F5F9] transition-colors font-manrope text-sm font-medium scale-95 active:scale-100" href="#">
<span class="material-symbols-outlined text-lg">code</span>
                Problems
            </a>
<a class="flex items-center gap-3 px-3 py-2 rounded-sm bg-[#334155] text-[#F1F5F9] border-r-4 border-[#3B82F6] rounded-r-sm font-manrope text-sm font-medium" href="#">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">forum</span>
                Clarifications
            </a>
</nav>
</aside>
<div class="flex-1 flex flex-col min-w-0 relative">
<header class="bg-[#1E293B] border-b border-[#334155] flex justify-between items-center h-16 px-6 w-full z-10 shrink-0">
<div class="flex items-center gap-8">
<span class="text-lg font-bold text-[#F1F5F9] tracking-tighter">CodeMetric Pro</span>
</div>
</header>
<main class="flex-1 p-8 bg-background relative z-0">
<!-- Background skeleton content -->
<div class="max-w-5xl mx-auto space-y-6 opacity-40">
<div class="h-8 w-48 bg-surface-variant rounded-DEFAULT"></div>
<div class="h-64 w-full bg-surface-container rounded-xl border border-surface-variant"></div>
</div>
</main>
</div>
<!-- MODAL OVERLAY (Task-Focused Focus) -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-[#0b0e15]/80 backdrop-blur-md transition-all duration-300">
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="bg-surface-container w-full max-w-lg rounded-xl border border-outline-variant shadow-[0_0_60px_rgba(0,0,0,0.6)] flex flex-col overflow-hidden transform transition-all duration-300 scale-100 opacity-100" role="dialog">
<!-- Header -->
<div class="flex justify-between items-center px-lg py-md border-b border-surface-variant bg-surface-container-high/50">
<h2 class="font-h3 text-on-surface flex items-center gap-sm" id="modal-title">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">help_center</span>
                    Ask Clarification
                </h2>
<button aria-label="Close" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-variant rounded-full p-xs transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg bg-surface-container">
<!-- Helper Text -->
<div class="flex items-start gap-sm p-sm rounded-DEFAULT bg-tertiary-container/10 border border-tertiary-container/20">
<span class="material-symbols-outlined text-tertiary-container text-md mt-0.5" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-sm text-on-surface-variant">
<strong class="text-tertiary-fixed-dim font-medium">Important:</strong> Ask only if statement is unclear. Do not ask for hints or test cases.
                    </p>
</div>
<form class="flex flex-col gap-lg">
<!-- Problem Selector -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider" for="problem-select">Select Problem</label>
<div class="relative">
<select class="appearance-none w-full bg-surface border border-outline-variant text-on-surface font-body-md rounded-DEFAULT py-sm pl-sm pr-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors cursor-pointer" id="problem-select" name="problem">
<option disabled="" selected="" value="">Choose a problem...</option>
<option value="A">A - Algorithm Analysis</option>
<option value="B">B - Binary Trees</option>
<option value="C">C - Combinatorics Challenge</option>
<option value="D">D - Dynamic Programming</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
</div>
<!-- Question Textarea -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-on-surface-variant uppercase tracking-wider flex justify-between" for="question-text">
                            Your Question
                            <span class="text-outline font-normal text-xs normal-case tracking-normal">Max 500 chars</span>
</label>
<textarea class="w-full bg-surface border border-outline-variant text-on-surface font-body-md rounded-DEFAULT p-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-y min-h-[120px]" id="question-text" name="question" placeholder="Describe specifically what part of the problem statement requires clarification..." rows="5"></textarea>
</div>
</form>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-surface-variant bg-surface-container-low flex justify-end gap-md">
<button class="px-lg py-sm font-label-md text-on-surface hover:bg-surface-variant rounded-DEFAULT transition-colors border border-transparent focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-low" type="button">
                    Cancel
                </button>
<button class="px-lg py-sm font-label-md bg-primary text-on-primary rounded-DEFAULT hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-low flex items-center gap-xs" type="submit">
<span class="material-symbols-outlined text-sm">send</span>
                    Submit Question
                </button>
</div>
</div>
</div>
</body></html>
